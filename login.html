<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias del Sur - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo"><h1>Delicias del Sur</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="registro.html">Registrar usuario</a>
        </div>
    </header>

    <main class="container">
        <h2>Iniciar Sesión</h2>
        <form id="form-login" novalidate>
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" required placeholder="Ingrese su correo">
            <span class="error-message" id="error-correo"></span>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
            <span class="error-message" id="error-password"></span>

            <button type="submit" class="btn">Ingresar</button>
            
            <p style="margin-top: 1rem; text-align: center;">
                ¿No tienes una cuenta? <a href="registro.html" style="color: #8c1c13; font-weight: bold; text-decoration: underline;">Regístrate aquí</a>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Delicias del Sur S.A. - Planta San Fernando.</p>
    </footer>

    <script src="js/validaciones.js"></script>
</body>
</html>
