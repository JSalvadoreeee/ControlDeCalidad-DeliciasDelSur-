<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias del Sur - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo"><h1>Delicias del Sur</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Inicio de Sesión</h2>
        <form id="form-login" novalidate>
            <label for="correo">Correo Electrónico:</label><br>
            <input type="email" id="correo" name="correo" required>
            <span class="error-message" id="error-correo"></span><br><br>

            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" required>
            <span class="error-message" id="error-password"></span><br><br>

            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Delicias del Sur S.A.</p>
    </footer>
    <script src="js/validaciones.js"></script>
</body>
</html>
