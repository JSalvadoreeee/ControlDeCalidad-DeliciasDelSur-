<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias del Sur - Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo"><h1>Delicias del Sur</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a> | <a href="carrito.html">Carro (0)</a>
        </div>
    </header>

    <main class="container">
        <h2>Formulario de Contacto</h2>
        <form id="form-contacto" novalidate>
            <label for="nombre">Nombre Completo:</label><br>
            <input type="text" id="nombre" name="nombre" required placeholder="Ingrese nombre y apellido">
            <span class="error-message" id="error-nombre"></span><br><br>

            <label for="correo">Correo Electrónico:</label><br>
            <input type="email" id="correo" name="correo" placeholder="Ingrese su correo" required>
            <span class="error-message" id="error-correo"></span><br><br>

            <label for="comentario">Comentario / Mensaje:</label><br>
            <textarea id="comentario" name="comentario" rows="5" required placeholder="Escriba su comentario o mensaje"></textarea>
            <span class="error-message" id="error-comentario"></span><br><br>

            <button type="submit" class="btn">Enviar Mensaje</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Delicias del Sur S.A. - Planta San Fernando.</p>
    </footer>

    <script src="js/validaciones.js"></script>
</body>
</html>
