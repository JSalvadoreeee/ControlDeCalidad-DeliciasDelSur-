<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias del Sur - Registro de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo"><h1>Delicias del Sur</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a> | <a href="carrito.html">Carro (0)</a>
        </div>
    </header>

    <main class="container">
        <h2>Registro de Nuevo Cliente</h2>
        <form id="form-registro" novalidate>
            <label for="run">RUN / RUT:</label>
            <input type="text" id="run" name="run" required placeholder="Ej: 12345678-9">
            <span class="error-message" id="error-run"></span>

            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Charles Aránguiz">
            <span class="error-message" id="error-nombre"></span>

            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" required placeholder="Ej: charles@correo.com">
            <span class="error-message" id="error-correo"></span>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
            <span class="error-message" id="error-password"></span>

            <label for="region">Región de Despacho:</label>
            <select id="region" name="region" required>
                <option value="">-- Seleccione una región --</option>
                <option value="RM">Región Metropolitana de Santiago</option>
                <option value="OHiggins">Región del Libertador General Bernardo O'Higgins</option>
            </select>
            <span class="error-message" id="error-region"></span>

            <label for="comuna">Comuna:</label>
            <select id="comuna" name="comuna" required>
                <option value="">-- Seleccione una comuna --</option>
                <optgroup label="Región Metropolitana">
                    <option value="san_bernardo">San Bernardo</option>
                    <option value="santiago">Santiago Centro</option>
                    <option value="providencia">Providencia</option>
                    <option value="las_condes">Las Condes</option>
                    <option value="maipu">Maipú</option>
                    <option value="puente_alto">Puente Alto</option>
                    <option value="el_bosque">El Bosque</option>
                </optgroup>
                <optgroup label="Región de O'Higgins">
                    <option value="san_fernando">San Fernando</option>
                    <option value="rancagua">Rancagua</option>
                    <option value="rengo">Rengo</option>
                    <option value="machali">Machalí</option>
                    <option value="chimbarongo">Chimbarongo</option>
                    <option value="pichilemu">Pichilemu</option>
                </optgroup>
            </select>
            <span class="error-message" id="error-comuna"></span>

            <button type="submit" class="btn">Registrar Usuario</button>

            <p style="margin-top: 1rem; text-align: center;">
                ¿Ya tienes una cuenta? <a href="login.html" style="color: #8c1c13; font-weight: bold; text-decoration: underline;">Inicia sesión aquí</a>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Delicias del Sur S.A. - Planta San Fernando.</p>
    </footer>

    <script src="js/validaciones.js"></script>
</body>
</html>
