<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias del Sur - Registro de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo"><h1>Delicias del Sur</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Registro de Usuario</h2>
        <form id="form-registro">
            <label for="run">RUN (Sin puntos ni guión, ej: 19011022K):</label><br>
            <input type="text" id="run" name="run" required><br><br>

            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="apellidos">Apellidos:</label><br>
            <input type="text" id="apellidos" name="apellidos" required><br><br>

            <label for="correo">Correo Electrónico:</label><br>
            <input type="email" id="correo" name="correo" required><br><br>

            <label for="region">Región:</label><br>
            <select id="region" name="region">
                <option value="">Seleccione Región</option>
                <option value="rm">Región Metropolitana de Santiago</option>
                <option value="ohiggins">Región del Libertador General Bernardo O'Higgins</option>
            </select><br><br>

            <label for="comuna">Comuna:</label><br>
            <select id="comuna" name="comuna">
                <option value="">Seleccione Comuna</option>
                <option value="san_fernando">San Fernando</option>
                <option value="san_bernardo">San Bernardo</option>
            </select><br><br>

            <label for="direccion">Dirección:</label><br>
            <input type="text" id="direccion" name="direccion" required><br><br>

            <button type="submit" class="btn">Registrarme</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Delicias del Sur S.A.</p>
    </footer>
    <script src="js/regiones-comunas.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
